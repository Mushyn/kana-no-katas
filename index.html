<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kana no Katas — Apprendre les kanas japonais</title>
  <meta name="description" content="Jeu d'apprentissage des kanas japonais par glisser-déposer avec répétition espacée." />
  <meta name="theme-color" content="#A855F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kana no Katas" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="viewport.js"></script>
  <script src="header-tools.js"></script>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="hd-left">
      <a class="hd-back" href="menu.html" aria-label="Retour au menu des jeux" title="Menu des jeux">←</a>
      <h1>かな の 型</h1>
    </div>
    <div id="mode-toggle">
      <button class="mode-btn active" onclick="setMode('both',this)">ひ+カ</button>
      <button class="mode-btn" onclick="setMode('hiragana',this)">ひ</button>
      <button class="mode-btn" onclick="setMode('katakana',this)">カ</button>
    </div>
    <span class="hd-tools" data-tools="ch02"></span>
  </div>

  <div id="score-bar">
    <span class="sp sp-ok"   id="s-ok">✓ 0</span>
    <span class="sp sp-err"  id="s-err">✗ 0</span>
    <span class="sp sp-left" id="s-left">◎ 0</span>
    <span class="sp sp-retry" id="s-retry" style="display:none">↺ 0</span>
    <button class="eye-btn" id="eye-btn" onclick="toggleGridRomaji()" aria-pressed="false" aria-label="Masquer les sons dans la grille" title="Afficher / masquer les sons (romaji) dans la grille">
      <svg class="eye-on" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="eye-off" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
    <button id="col-selector-btn" onclick="toggleColSelector()"><span id="col-selector-label">Colonnes ▾</span></button>
  </div>


  <!-- Panneau de sélection (masqué par défaut) -->
  <div id="col-selector-panel" style="display:none;">
    <div id="col-selector-header">
      <span>Choisir les colonnes</span>
      <div style="display:flex;gap:6px;">
        <button onclick="selectAllCols()">Toutes</button>
        <button onclick="selectNoneCols()">Aucune</button>
        <button class="btn-apply" onclick="applyColSelection()">Appliquer ✓</button>
      </div>
    </div>
    <div id="col-checkboxes"></div>
  </div>

  <div id="grid-zone">
    <div id="grid-scroll">
      <div id="grid"></div>
    </div>
  </div>

  <div id="divider"></div>

  <div id="card-zone">
    <div id="deck-controls">
      <label>Cartes :</label>
      <button class="dc-btn active" onclick="setDeckSize(1,this)">1/1</button>
      <button class="dc-btn" onclick="setDeckSize(5,this)">5/5</button>
      <button class="dc-btn" id="btnhint" onclick="toggleHints()">Romaji</button>
      <span id="diac-switch-group">
        <span id="diac-switch-label">Diacritiques</span>
        <button id="diac-switch" onclick="toggleDiacritics(this)" aria-pressed="false">
          <span class="rt-knob"></span>
        </button>
        <span id="diac-switch-state">off</span>
      </span>
    </div>
    <div id="msg"></div>
    <div id="deck-scroll"></div>
    <div id="actions">
      <button onclick="resetGame()" aria-label="Recommencer" title="Recommencer">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
      <button onclick="drawMore()" aria-label="Ajouter des cartes" title="Ajouter des cartes">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  </div>

  <!-- Feedback erreur -->
  <div id="feedback">
    <div class="fb-char"   id="fb-char"></div>
    <div class="fb-romaji" id="fb-romaji"></div>
    <div class="fb-col"    id="fb-col"></div>
    <div class="fb-msg">↺ Reproposé dans ~15 cartes</div>
  </div>

  <!-- Bilan -->
  <div id="bilan">
    <h2>Bien joué !</h2>
    <div class="bilan-stats">
      <div class="bstat ok"><div class="val" id="b-ok">0</div><div class="lbl">Réussis</div></div>
      <div class="bstat err"><div class="val" id="b-err">0</div><div class="lbl">Erreurs</div></div>
      <div class="bstat pct"><div class="val" id="b-pct">—</div><div class="lbl">Réussite</div></div>
    </div>
    <div class="bilan-section" id="b-errors-section">
      <h3>À retravailler</h3>
      <div class="bilan-grid" id="b-errors"></div>
    </div>
    <div class="bilan-section">
      <h3>Maîtrisés</h3>
      <div class="bilan-grid" id="b-ok-grid"></div>
    </div>
    <button onclick="resetGame()">↺ Recommencer</button>
    <button onclick="window.location.href='scores.html'" class="bilan-trace-btn">Mes scores</button>
    <button onclick="window.location.href='menu.html'">Menu des jeux</button>
  </div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script src="game.js"></script>
<div id="sw-update-banner" style="display:none;">
  <span>✨ Nouvelle version disponible</span>
  <button onclick="applySwUpdate()">Mettre à jour</button>
</div>
<script>
  let swRegistration = null;

  function showUpdateBanner() {
    document.getElementById('sw-update-banner').style.display = 'flex';
  }

  function applySwUpdate() {
    if (!swRegistration || !swRegistration.waiting) return;
    swRegistration.waiting.postMessage('SKIP_WAITING');
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => {
          swRegistration = reg;
          console.log('SW OK', reg.scope);

          // Cas 1 : un SW est déjà en attente au moment où la page se charge
          // (l'utilisateur avait laissé un onglet ouvert pendant le déploiement).
          if (reg.waiting) showUpdateBanner();

          // Cas 2 : un nouveau SW vient d'être détecté pendant cette session.
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner();
              }
            });
          });
        })
        .catch(e => console.warn('SW KO', e));

      // Une fois le nouveau SW activé (après le clic sur "Mettre à jour"),
      // on recharge la page pour charger les nouveaux fichiers.
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      // Sécurité supplémentaire : revérifie une nouvelle version toutes les heures
      // tant que l'app reste ouverte, au cas où un cache intermédiaire (CDN, proxy)
      // retarderait la détection automatique du navigateur.
      setInterval(() => { if (swRegistration) swRegistration.update(); }, 60 * 60 * 1000);
    });
  }
</script>
</body>
</html>
